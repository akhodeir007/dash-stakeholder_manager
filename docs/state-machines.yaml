        effects: [notify_all]
        roles: [STAKEHOLDER_MANAGER]
    invariants:
      - critical_risk_requires_executive_visibility
      - accepted_risk_requires_review_date

# ---------------------------------------------------------------------------
# SM-8 — Escalation and notification
# ---------------------------------------------------------------------------

  SM_8_escalation:
    title: Escalation notification
    aggregate: Escalation
    initial: PENDING
    terminal: [CLOSED]
    states:
      PENDING: {kind: initial}
      SENT: {kind: active}
      DELIVERED: {kind: active}
      ACKNOWLEDGED: {kind: active}
      ESCALATED: {kind: active}
      FAILED: {kind: active}
      CLOSED: {kind: success}
    transitions:
      - id: S8-T01
        from: PENDING
        event: SEND
        to: SENT
        guards: [dedupe_key_unique, recipient_resolved, template_rendered]
        effects: [record_delivery_attempt]
        roles: [SYSTEM]
      - id: S8-T02
        from: SENT
        event: DELIVER
        to: DELIVERED
        guards: [delivery_webhook_received]
        effects: [update_delivery_status]
        roles: [SYSTEM]
      - id: S8-T03
        from: DELIVERED
        event: ACKNOWLEDGE
        to: ACKNOWLEDGED
        guards: [acknowledgment_recorded]
        effects: [stop_escalation_timer]
        roles: [STAKEHOLDER_MANAGER, AOR_LEAD, CLIENT_EXECUTIVE]
      - id: S8-T04
        from: [DELIVERED, ACKNOWLEDGED]
        event: ESCALATE
        to: ESCALATED
        guards: [acknowledgment_deadline_passed, next_level_resolved]
        effects: [notify_next_level, extend_timer]
        roles: [SYSTEM]
      - id: S8-T05
        from: SENT
        event: FAIL
        to: FAILED
