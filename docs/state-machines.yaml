      QUARANTINED: {kind: blocked}
      EXTRACTED: {kind: active}
      VALIDATED: {kind: active}
      ACTIVE: {kind: success}
      EXPIRING: {kind: active}
      EXPIRED: {kind: blocked}
      REJECTED: {kind: terminal}
      SUPERSEDED: {kind: terminal}
    transitions:
      - id: S10-T01
        from: UPLOADED
        event: SCAN
        to: SCANNING
        guards: [hash_computed, file_type_allowed, size_within_limit]
        effects: [run_malware_scan]
        roles: [SYSTEM]
      - id: S10-T02
        from: SCANNING
        event: EXTRACT_OK
        to: EXTRACTED
        guards: [scan_clean]
        effects: [text_extraction, queued_drex_extraction]
        roles: [SYSTEM]
      - id: S10-T03
        from: SCANNING
        event: QUARANTINE
        to: QUARANTINED
        guards: [scan_threat_detected]
        effects: [block_document, notify_admin]
        roles: [SYSTEM]
      - id: S10-T04
        from: EXTRACTED
        event: VALIDATE
        to: VALIDATED
