  SM_2B_case:
    title: Site clearance case (derived aggregate)
    aggregate: SiteClearanceCase
    initial: NOT_STARTED
    terminal: [WITHDRAWN, REJECTED]
    config:
      active_ref: B2-SC-A-2026-001625
      legacy_ref: B2-SC-A-2026-001525
      pre_project_allowed: true
      government_exemption_allowed: true
    states:
      NOT_STARTED: {kind: initial}
      PRE_PROJECT: {kind: active}
      PREPARING: {kind: active}
      SUBMITTED: {kind: active}
      UNDER_REVIEW: {kind: active}
      PARTIALLY_APPROVED: {kind: active}
      PENDING_MODIFICATION: {kind: blocked_on_applicant}
      ALL_ENTITIES_APPROVED: {kind: success}
      EXEMPT_GOVERNMENT_PROJECT: {kind: success, requires_review_date: true}
      REOPENED: {kind: active}
      REJECTED: {kind: terminal_alert}
      WITHDRAWN: {kind: terminal}
    transitions:
      - id: S2BC-T01
        from: NOT_STARTED
        event: START
        to: PREPARING
        guards: [step01_approved_or_project_linked, all_required_entities_initialized]
        effects: [create_entity_cases]
        roles: [AOR_LEAD, STAKEHOLDER_MANAGER]
      - id: S2BC-T02
        from: NOT_STARTED
        event: START_PRE_PROJECT
        to: PRE_PROJECT
        guards: [site_clearance_pre_project_allowed, plot_identified, initiator_is_consultant_or_contractor]
        effects: [create_pre_project_case, create_entity_cases, notify_aor]
        roles: [AOR_LEAD, CONTRACTOR]
      - id: S2BC-T03
        from: PRE_PROJECT
        event: LINK_PROJECT
        to: PREPARING
        guards: [meps_project_registered, project_link_recorded]
        effects: [link_to_meps_project, notify_all]
        roles: [AOR_LEAD]
      - id: S2BC-T04
        from: PREPARING
        event: SUBMIT
        to: SUBMITTED
        guards: [at_least_one_entity_submitted]
        effects: [notify_authorities]
        roles: [AOR_LEAD, CONTRACTOR]
      - id: S2BC-T05
        from: SUBMITTED
        event: ACKNOWLEDGE
        to: UNDER_REVIEW
        guards: [authority_receipts_captured]
        effects: [start_case_sla]
        roles: [AOR_LEAD, CONTRACTOR]
      - id: S2BC-T06
        from: UNDER_REVIEW
        event: PARTIAL_APPROVAL
        to: PARTIALLY_APPROVED
        guards: [at_least_one_entity_approved, not_all_entities_approved]
        effects: [update_closure_index, notify_stakeholder]
        roles: [SYSTEM]
      - id: S2BC-T07
        from: [UNDER_REVIEW, PARTIALLY_APPROVED, PENDING_MODIFICATION]
        event: ALL_APPROVED
        to: ALL_ENTITIES_APPROVED
        guards:
          - all_required_entities_approved_waived_or_not_required
          - all_approved_entities_reliance_verified
          - no_unwaived_unavailable_infrastructure
        effects: [unlock_step02b, unlock_step04_precheck, emit_site_clearance_all_approved]
        roles: [SYSTEM]
      - id: S2BC-T08
        from: [UNDER_REVIEW, PARTIALLY_APPROVED]
        event: RECEIVE_MODIFICATIONS
        to: PENDING_MODIFICATION
        guards: [any_required_entity_in_modification_or_pending_documents]
        effects: [update_case_status, start_modification_clock, notify_stakeholder]
        roles: [SYSTEM]
      - id: S2BC-T09
        from: PENDING_MODIFICATION
        event: RESUME_REVIEW
        to: UNDER_REVIEW
        guards: [all_required_entities_resubmitted]
        effects: [restart_case_sla]
        roles: [SYSTEM]
      - id: S2BC-T10
        from: PENDING_MODIFICATION
        event: PARTIAL_APPROVAL
        to: PARTIALLY_APPROVED
        guards: [at_least_one_entity_approved, not_all_entities_approved]
        effects: [update_closure_index]
        roles: [SYSTEM]
      - id: S2BC-T11
        from: ALL_ENTITIES_APPROVED
        event: REOPEN
        to: REOPENED
        guards: [entity_expired_or_revoked, reason_recorded]
        effects: [lock_step02b, lock_step04, notify_all]
        roles: [AOR_LEAD, STAKEHOLDER_MANAGER]
      - id: S2BC-T12
        from: REOPENED
        event: RESUME
        to: UNDER_REVIEW
        guards: [replacement_entity_submitted]
        effects: [restart_case_sla]
        roles: [AOR_LEAD]
      - id: S2BC-T13
        from: [UNDER_REVIEW, PARTIALLY_APPROVED, PENDING_MODIFICATION]
        event: REJECT_CASE
        to: REJECTED
        guards: [all_entities_rejected_or_unavailable, executive_notification_recorded]
        effects: [lock_step02b, lock_step04, create_high_risk, notify_all]
        roles: [STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]
      - id: S2BC-T14
        from: [NOT_STARTED, PRE_PROJECT, PREPARING]
        event: GRANT_GOVERNMENT_EXEMPTION
        to: EXEMPT_GOVERNMENT_PROJECT
        guards:
          - government_owned_project_confirmed
          - dmt_masterplan_approval_evidence
          - adm_meps_exemption_confirmation
          - executive_approval_recorded
          - review_date_recorded
          - reason_recorded
        effects: [record_exemption, unlock_step02b, unlock_step04_precheck, notify_all]
        roles: [STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE, SYSTEM_ADMIN]
        dual_control: true
      - id: S2BC-T15
        from: EXEMPT_GOVERNMENT_PROJECT
        event: REVOKE_EXEMPTION
        to: REOPENED
        guards: [exemption_no_longer_valid, reason_recorded]
        effects: [lock_step02b, lock_step04, notify_all, create_action]
        roles: [STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]
      - id: S2BC-T16
        from: [NOT_STARTED, PRE_PROJECT, PREPARING, SUBMITTED, UNDER_REVIEW, PARTIALLY_APPROVED, PENDING_MODIFICATION, REOPENED]
        event: WITHDRAW
        to: WITHDRAWN
        guards: [reason_recorded]
        effects: [audit_event]
        roles: [STAKEHOLDER_MANAGER]
    derived:
      closure_index: approved_or_waived_or_not_required_required_entities / required_entities * 100
      all_approved: all(entity.state in [APPROVED, WAIVED, NOT_REQUIRED]) and all(approved.reliance_status == VERIFIED)
      blocking_entities: entities in [REJECTED_INFRASTRUCTURE_UNAVAILABLE, MODIFICATION_REQUIRED, PENDING_DOCUMENTS]
      exemption_active: state == EXEMPT_GOVERNMENT_PROJECT
    invariants:
      - exemption_requires_government_ownership_dmt_approval_and_adm_confirmation
      - reliance_check_required_before_downstream_use
      - pre_project_case_must_link_before_step04
      - approved_entity_without_reliance_check_does_not_unlock_dependents

