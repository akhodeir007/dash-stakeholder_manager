        effects: [store_extraction_fields, notify_owner]
        roles: [AOR_LEAD, STAKEHOLDER_MANAGER, THIRD_PARTY_INSPECTOR]
      - id: S10-T05
        from: VALIDATED
        event: ACTIVATE
        to: ACTIVE
        guards: [expiry_date_present_if_applicable, scan_clean, not_expired, independent_validation_current_if_regulated]
        effects: [link_to_aggregate, schedule_expiry_alerts]
