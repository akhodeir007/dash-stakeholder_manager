# ---------------------------------------------------------------------------
# Cross-machine orchestration
# ---------------------------------------------------------------------------

orchestration:
  - event: MASTERPLAN_FROZEN
    handlers:
      - unlock_parcel_level_meps_cases
      - notify_all_stakeholders
      - snapshot_baseline_kpi
  - event: SITE_CLEARANCE_ALL_APPROVED
    handlers:
      - unlock_sm_2c_soil_work
      - recompute_sm_2e_readiness
      - notify_aor_and_stakeholder
  - event: SITE_CLEARANCE_GOVERNMENT_EXEMPT
    handlers:
      - unlock_sm_2c_soil_work
      - recompute_sm_2e_readiness
      - create_exemption_review_action
      - notify_all_stakeholders
  - event: APPROVAL_RELIANCE_VERIFIED
    handlers:
      - recompute_site_clearance_case
      - recompute_sm_2e_readiness
  - event: ENOC_INFRASTRUCTURE_APPROVED
    handlers:
      - recompute_taqa_super_plot_entities
      - recompute_sm_2e_readiness
  - event: PACKAGE_SCOPE_APPROVED
    handlers:
      - recompute_sm_2e_readiness
      - snapshot_package_scope
  - event: CONTRACTOR_ASSIGNED
    handlers:
      - recompute_step05_readiness  # assignment alone never enables issuance before Step 04 and appointment approval
      - notify_aor
  - event: STEP03A_REQUIREMENT_ACTIVATED
    handlers:
      - create_step03a_workstream
      - notify_owner
  - event: STEP03B_REQUIREMENT_ACTIVATED
    handlers:
      - create_step03b_workstream
      - notify_owner
  - event: THIRD_PARTY_INSPECTION_ACTIVE
    handlers:
      - unlock_structural_plan_review
      - unlock_inspection_tasks
      - unlock_soil_report_stamp
      - notify_qualiconsult
  - event: SOIL_REPORT_STAMPED
    handlers:
      - recompute_sm_2e_readiness
      - notify_aor
  - event: INFRA_STEP_APPROVED
    handlers:
      - unblock_dependent_infra_steps
      - update_critical_path
      - recompute_step04_ldn_cross_link
  - event: COMMENT_OPEN_GT_7_BUSINESS_DAYS
    handlers:
      - trigger_escalation_rule_1
  - event: ENTITY_REJECTED_INFRASTRUCTURE_UNAVAILABLE
    handlers:
      - create_high_risk
      - trigger_escalation_rule_2
  - event: STEP04_READY_AND_SOIL_PENDING
    handlers:
      - lock_step04_release
      - trigger_escalation_rule_3
  - event: APPLICATION_SLA_OVERFLOW
    handlers:
      - highlight_red_on_executive_dashboard
      - generate_follow_up_letter_from_template
      - trigger_escalation_rule_4
  - event: DREX_RECOMMENDATION_CREATED
    handlers:
      - persist_decision_record
      - if_mode_advisory_show_recommendation
    forbidden_handlers:
      - any_state_transition

# ---------------------------------------------------------------------------
# Escalation rules (PRD §6.2)
# ---------------------------------------------------------------------------

escalation_rules:
  - id: RULE_1
    name: Site clearance delay
    condition: site_clearance_entity_state in [MODIFICATION_REQUIRED, PENDING_DOCUMENTS] for > 7 business days
    action: daily alert to AOR discipline lead and stakeholder manager
    dedupe: rule_1 + entity_id + business_date
  - id: RULE_2
    name: Unavailable utility infrastructure
    condition: entity_state == REJECTED_INFRASTRUCTURE_UNAVAILABLE or unavailable_service_comment_open
    action: create high-priority blocker + executive notice to IMKAN legal and regulatory escalation
    dedupe: rule_2 + entity_id + business_date
  - id: RULE_3
    name: Third-party inspection gate
    condition: step04 == READY_FOR_SUBMISSION and soil_report == PENDING_THIRD_PARTY_STAMP
    action: lock step04 release + action request to Qualiconsult lead inspector
    dedupe: rule_3 + case_id + business_date
  - id: RULE_4
    name: Authority SLA overflow
    condition: application_review_duration > internal_sla_target_days
    action: red highlight on executive dashboard + pre-filled follow-up letter from approved template
    dedupe: rule_4 + application_id + business_date
    sla_is_internal_target: true

# ---------------------------------------------------------------------------
# DREX integration (Nace AI)
# ---------------------------------------------------------------------------

drex:
  provider: nace_ai
  decision_endpoint: https://console.nace.ai/v1/systemone
  document_endpoint_base: https://console.nace.ai/v1/documents
  auth: bearer_token_from_secret_manager
  model_routing:
    text_classification: drex-v1.5
    vision_or_scanned_documents: drex-max
    self_hosted_air_gapped: drex-v2.0
    development_alias: drex-latest
  response_contract: typed_only_no_free_text
  modes: ["OFF", SHADOW, ADVISORY, ASSISTED]
  autonomous_mode: forbidden
  state_string:
    max_tokens_routine: 12000
    delimit_untrusted_text: true
    no_cross_project_data: true
    no_pii_unless_required: true
  timeouts:
    text_seconds: 3
    vision_or_long_document_seconds: 8
    retries: 1
    circuit_breaker_failures: 5
  confidence_policy:
    display: [LOW, MEDIUM, HIGH]
    default_accept: false
    abstain_below: 0.60
    advisory_min: 0.75
  option_sets:
    versioned: true
    require_unclear_option: true
    change_requires_eval_rerun: true
  decision_types:
    - id: D1
      name: Document type
      question_type: choice
      options: [NOC, AUTHORITY_LETTER, STAMPED_DRAWING, SITE_PLAN, CONTRACT, OTHER, UNCLEAR]
      first_mode: SHADOW
      sprint: 2
      metric: macro_f1
      threshold: 0.90
    - id: D2
      name: Evidence fields
      question_type: document_extract_ground
      fields: [authority, reference_no, issue_date, expiry_date, plot_id, status]
      first_mode: SHADOW
      sprint: 2
      metric: field_f1
      threshold: 0.95
    - id: D3
      name: Third-party stamp present
      question_type: noul
      options: ["yes", "no", unclear]
      first_mode: SHADOW
      sprint: 3
      metric: precision_recall
      threshold: 0.95
    - id: D4
      name: Comment category
      question_type: choice
      options: [SPATIAL_GEOMETRY, UTILITY_CAPACITY, DOCUMENTATION_DEFICIT, FEE_PAYMENT, POLICY_UNDERTAKING, UNCLEAR]
      first_mode: SHADOW
      sprint: 3
      metric: macro_f1
      threshold: 0.85
    - id: D5
      name: Comment discipline routing
      question_type: choice
      options: [ARCHITECTURE, STRUCTURE, MEP, INFRASTRUCTURE, ESTIDAMA, LDN, OTHER]
      first_mode: SHADOW
      sprint: 3
      metric: top_1_accuracy
      threshold: 0.85
    - id: D6
      name: Response completeness
      question_type: noul
      options: [addressed, not_addressed, unclear]
      first_mode: SHADOW
      sprint: 3
      metric: recall
      threshold: 0.95
    - id: D7
      name: Duplicate submission
      question_type: noul
      options: [duplicate, not_duplicate, unclear]
      first_mode: SHADOW
      sprint: 3
      metric: precision
      threshold: 0.90
    - id: D8
      name: Risk severity
      question_type: score
      levels: [LOW, MEDIUM, HIGH, CRITICAL]
      first_mode: SHADOW
      sprint: 4
      metric: quadratic_weighted_kappa
      threshold: 0.75
    - id: D9
      name: Escalation route
      question_type: choice
      options: [AOR_LEAD, STAKEHOLDER_MANAGER, IMKAN_LEGAL, EXECUTIVE, AUTHORITY_FOLLOW_UP, UNCLEAR]
      first_mode: SHADOW
      sprint: 4
      metric: top_1_accuracy
      threshold: 0.85
    - id: D10
      name: Readiness judgment
      question_type: noul
      options: [complete, incomplete, unclear]
      first_mode: SHADOW
      sprint: 4
      metric: agreement
      threshold: 0.85
    - id: D11
      name: Anomaly type
      question_type: choice
      options: [STATUS_DRIFT, EXPIRED_EVIDENCE, CONTRADICTORY_DATES, MISSING_AUTHORITY_REF, NONE, UNCLEAR]
      first_mode: SHADOW
      sprint: 4
      metric: macro_f1
      threshold: 0.85
    - id: D12
      name: Report highlight ranking
      question_type: score
      levels: [1, 2, 3, 4, 5]
      first_mode: SHADOW
      sprint: 5
      metric: ndcg_at_5
      threshold: 0.80
  guardrails:
    no_direct_state_write: true
    fail_closed: true
    kill_switch_per_decision_type: true
    global_kill_switch: true
    monthly_budget_cap: true
    pii_redaction: true
    prompt_injection_containment: option_set_only
    citation_required_for_document_decisions: true
    no_training_on_client_data_without_consent: true
    production_model_ids_pinned: true
  eval:
    golden_set_min_per_type: 100
    golden_set_min_d2: 300
    human_audit_sample_percent: 10
