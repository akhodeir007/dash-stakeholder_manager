# ---------------------------------------------------------------------------
# SM-1 — Masterplan compliance and baseline planning
# ---------------------------------------------------------------------------
machines:

  SM_1_masterplan:
    title: Masterplan compliance and baseline planning
    aggregate: Masterplan
    initial: CMP_APPROVED
    terminal: [BASELINE_FREEZE]
    config:
      certificate_ref: MPD-230126-0505
      dmt_correspondence_ref: DMT/MD/OUT/2026/4886
      certificate_issued_on: 2026-06-04
      valid_until: 2029-06-04
      required_conditions: 24
      allow_waivers_default: false
    states:
      CMP_APPROVED:
        kind: initial
        label: Concept master plan approved
      DMP_SUBMITTED:
        kind: active
      DMP_CONDITIONALLY_APPROVED:
        kind: active
        starts_clock: true
      DMP_AMENDMENT_REQUIRED:
        kind: blocking_branch
        blocks_downstream: true
      BASELINE_FREEZE:
        kind: success
        immutable: true
      VALIDITY_EXPIRED:
        kind: terminal_alert
        blocks_new_permits: true
    transitions:
      - id: SM1-T01
        from: CMP_APPROVED
        event: SUBMIT_DMP
        to: DMP_SUBMITTED
        guards: [submission_package_complete, dmt_receipt_captured]
        effects: [notify_aor, notify_stakeholder, start_submission_sla]
        roles: [AOR_LEAD, STAKEHOLDER_MANAGER]
      - id: SM1-T02
        from: DMP_SUBMITTED
        event: RECEIVE_CONDITIONAL_APPROVAL
        to: DMP_CONDITIONALLY_APPROVED
        guards: [dmt_correspondence_matches_4886, conditions_parsed_count_24]
        effects: [start_validity_tracker, create_24_condition_tasks, notify_all]
        evidence: [dmt_correspondence]
        roles: [STAKEHOLDER_MANAGER]
      - id: SM1-T03
        from: DMP_SUBMITTED
        event: RECEIVE_AMENDMENT_REQUEST
        to: DMP_AMENDMENT_REQUIRED
        guards: [dmt_letter_captured]
        effects: [block_downstream_permits, notify_aor, notify_client]
        roles: [STAKEHOLDER_MANAGER]
      - id: SM1-T04
        from: DMP_CONDITIONALLY_APPROVED
        event: FREEZE_BASELINE
        to: BASELINE_FREEZE
        guards:
          - all_conditions_accepted
          - no_open_amendment
          - executive_approval_recorded
          - evidence_complete_for_all_conditions
        effects:
          - create_immutable_baseline_version
          - freeze_baseline_documents
          - unlock_parcel_submissions
          - notify_all
        roles: [STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]
        dual_control: true
      - id: SM1-T05
        from: DMP_CONDITIONALLY_APPROVED
        event: RAISE_AMENDMENT
        to: DMP_AMENDMENT_REQUIRED
        guards: [noc_conflict_evidence_present]
        effects: [block_downstream_permits, notify_dmt_owner]
        roles: [STAKEHOLDER_MANAGER, AOR_LEAD]
      - id: SM1-T06
        from: DMP_AMENDMENT_REQUIRED
        event: RESUBMIT_AMENDMENT
        to: DMP_SUBMITTED
        guards: [amended_package_complete, impact_assessment_complete]
        effects: [start_new_review_cycle, preserve_prior_version]
        roles: [AOR_LEAD]
      - id: SM1-T07
        from: BASELINE_FREEZE
        event: APPROVED_BASELINE_CHANGE
        to: DMP_AMENDMENT_REQUIRED
        guards: [baseline_change_status_applied, executive_approval_recorded]
        effects: [version_bump, flag_affected_cases_for_revalidation, block_downstream]
        roles: [CLIENT_EXECUTIVE, SYSTEM_ADMIN]
        dual_control: true
      - id: SM1-T08
        from: DMP_CONDITIONALLY_APPROVED
        event: CLOCK_EXPIRES
        to: VALIDITY_EXPIRED
        guards: [today_after_valid_until, no_renewal_recorded]
        effects: [block_new_permits, executive_alert]
        roles: [SYSTEM]
      - id: SM1-T09
        from: VALIDITY_EXPIRED
        event: RENEW_VALIDITY
        to: DMP_CONDITIONALLY_APPROVED
        guards: [renewal_certificate_captured, new_validity_window_recorded]
        effects: [update_validity_dates, audit_event]
        evidence: [renewal_certificate]
        roles: [STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]
    invariants:
      - required_condition_count_must_equal_24
      - clock_starts_once_and_never_resets_except_renewal
      - freeze_requires_zero_open_conditions_or_approved_waivers
      - baseline_version_is_immutable_after_freeze
      - amendment_blocks_all_step04_and_step05_submissions

  SM_1_condition:
    title: DMP condition item
    aggregate: MasterplanCondition
    initial: OPEN
    terminal: [ACCEPTED, WAIVED]
    states:
      OPEN: {kind: active}
      EVIDENCE_SUBMITTED: {kind: active}
      UNDER_REVIEW: {kind: active}
      ACCEPTED: {kind: success}
      REJECTED: {kind: active}
      WAIVED: {kind: success, requires_review_date: true}
    transitions:
      - id: SMC-T01
        from: OPEN
        event: SUBMIT_EVIDENCE
        to: EVIDENCE_SUBMITTED
        guards: [evidence_uploaded, evidence_type_matches_condition]
        effects: [notify_reviewer]
        roles: [DISCIPLINE_LEAD, AOR_LEAD]
      - id: SMC-T02
        from: EVIDENCE_SUBMITTED
        event: START_REVIEW
        to: UNDER_REVIEW
        guards: [reviewer_assigned]
        effects: [notify_owner]
        roles: [STAKEHOLDER_MANAGER]
      - id: SMC-T03
        from: UNDER_REVIEW
        event: ACCEPT
        to: ACCEPTED
        guards: [acceptance_evidence_recorded]
        effects: [recompute_masterplan_freeze_gate, notify_owner]
        roles: [STAKEHOLDER_MANAGER]
      - id: SMC-T04
        from: UNDER_REVIEW
        event: REJECT
        to: REJECTED
        guards: [rejection_reason_recorded]
        effects: [notify_owner, create_action]
        roles: [STAKEHOLDER_MANAGER]
      - id: SMC-T05
        from: REJECTED
        event: RESUBMIT
        to: EVIDENCE_SUBMITTED
        guards: [new_evidence_uploaded]
        effects: [notify_reviewer]
        roles: [DISCIPLINE_LEAD, AOR_LEAD]
      - id: SMC-T06
        from: [OPEN, EVIDENCE_SUBMITTED, UNDER_REVIEW, REJECTED]
        event: WAIVE
        to: WAIVED
        guards: [authority_written_confirmation, executive_approval_recorded, review_date_recorded]
        effects: [create_waiver_record, notify_all]
        roles: [CLIENT_EXECUTIVE, SYSTEM_ADMIN]
        dual_control: true
      - id: SMC-T07
        from: WAIVED
        event: REOPEN
        to: OPEN
        guards: [executive_approval_recorded, reason_recorded]
        effects: [recompute_masterplan_freeze_gate]
        roles: [CLIENT_EXECUTIVE]
    invariants:
      - waiver_requires_authority_confirmation_and_review_date
      - accepted_condition_requires_evidence

# ---------------------------------------------------------------------------
# SM-2 — MEPS 5-step family
# ---------------------------------------------------------------------------

  SM_2A_registration:
    title: MEPS Step 01 project registration
    aggregate: MepsRegistration
    initial: NOT_STARTED
    terminal: [APPROVED]
    config:
      dmt_approval_optional: true
      requirement_list_source: MEPS_GENERATED
    states:
      NOT_STARTED: {kind: initial}
      DRAFT: {kind: active}
      SUBMITTED: {kind: active}
      APPROVED: {kind: success}
      RETURNED: {kind: active}
      WITHDRAWN: {kind: terminal}
    transitions:
      - id: S2A-T01
        from: NOT_STARTED
        event: START
        to: DRAFT
        guards: [affection_plan_valid, client_appointment_letter_valid, plot_baseline_present, dmt_approval_recorded_or_not_applicable]
        effects: [generate_mandatory_requirement_list, snapshot_meps_requirement_list]
        roles: [AOR_LEAD, CONTRACTOR]
      - id: S2A-T02
        from: DRAFT
        event: SUBMIT
        to: SUBMITTED
        guards: [meps_template_package_complete]
        effects: [record_submission_receipt, notify_stakeholder]
        roles: [AOR_LEAD]
      - id: S2A-T03
        from: SUBMITTED
        event: APPROVE
        to: APPROVED
        guards: [approval_evidence_captured]
        effects: [unlock_step02, notify_all]
        evidence: [registration_approval]
        roles: [AOR_LEAD]
      - id: S2A-T04
        from: SUBMITTED
        event: RETURN
        to: RETURNED
        guards: [return_reason_captured]
        effects: [create_action, notify_aor]
        roles: [AOR_LEAD]
      - id: S2A-T05
        from: RETURNED
        event: REVISE
        to: DRAFT
        guards: [corrections_recorded]
        effects: [notify_aor]
        roles: [AOR_LEAD]
      - id: S2A-T06
        from: [NOT_STARTED, DRAFT, SUBMITTED, RETURNED]
        event: WITHDRAW
        to: WITHDRAWN
        guards: [reason_recorded]
        effects: [audit_event]
        roles: [STAKEHOLDER_MANAGER]
    invariants:
      - step02_cannot_start_without_step01_approved

  SM_2B_entity:
    title: Site clearance authority entity
    aggregate: AuthorityApplication
    initial: NOT_STARTED
    terminal: [APPROVED, WAIVED, NOT_REQUIRED, WITHDRAWN]
    config:
      # Full entity set from the AOR tracker. The five "critical" entities in the
      # PRD are a subset, not the whole site-clearance scope.
      entities:
        - {id: ADNOC, refs: [B2-SC-A-2026-001525], seed_status: APPROVED, critical: false}
        - {id: TABREED, refs: [B2-SC-A-2026-001525], seed_status: APPROVED, critical: false}
        - {id: DU_TELECOM, refs: [B2-SC-A-2026-001525], seed_status: APPROVED_CONDITIONAL, critical: false, note: "Separate NOC required for master plan and ISP"}
        - {id: EAND_ETISALAT, refs: [B2-SC-A-2026-001525], seed_status: COMMENTS_REQUIRED, critical: true}
        - {id: ADSSC, alias: ADSCC, refs: [B2-SC-A-2026-001525, B2-SC-A-2026-001625], seed_status: COMMENTS_REQUIRED, critical: true}
        - {id: ADMCC, alias: MCC, refs: [B2-SC-A-2026-001525], seed_status: APPROVED_CONDITIONAL, critical: false}
        - {id: EAD, refs: [B2-SC-A-2026-001525], seed_status: APPROVED, critical: false}
        - {id: GHQ_MILITARY_TELECOM, refs: [B2-SC-A-2026-001525], seed_status: APPROVED, critical: false}
        - {id: ADPC_PORTS, refs: [B2-SC-A-2026-001525], seed_status: NOT_REQUIRED, critical: false}
        - {id: ENEC, refs: [B2-SC-A-2026-001525], seed_status: NOT_REQUIRED, critical: false}
        - {id: AAM_ROADS, refs: [B2-SC-A-2026-001525, B2-SC-A-2026-001625], seed_status: PENDING_DOCUMENTS, critical: true}
