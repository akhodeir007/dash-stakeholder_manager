        roles: [SYSTEM]
      - id: S8-T06
        from: FAILED
        event: RETRY
        to: PENDING
        guards: [retry_budget_available]
        effects: [increment_attempt]
        roles: [SYSTEM]
      - id: S8-T07
        from: [ACKNOWLEDGED, ESCALATED]
        event: CLOSE
        to: CLOSED
        guards: [condition_resolved_or_acknowledged]
        effects: [update_kpi]
        roles: [STAKEHOLDER_MANAGER]
    invariants:
      - dedupe_key_is_rule_entity_business_date
      - no_more_than_one_notification_per_dedupe_key

