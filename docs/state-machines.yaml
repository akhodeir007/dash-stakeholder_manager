        guards: [submission_receipt_captured]
        effects: [start_review_sla, notify_stakeholder]
        roles: [AOR_LEAD]
      - id: S6-T05
        from: SUBMITTED
        event: ACKNOWLEDGE
        to: ACKNOWLEDGED
        guards: [acknowledgement_captured]
        effects: [start_authority_sla]
        roles: [AOR_LEAD]
      - id: S6-T06
        from: ACKNOWLEDGED
        event: START_REVIEW
        to: UNDER_REVIEW
        guards: [authority_review_started]
        effects: [update_kpi]
        roles: [AOR_LEAD]
      - id: S6-T07
        from: UNDER_REVIEW
        event: APPROVE
        to: APPROVED
        guards: [approval_evidence_captured]
        effects: [close_related_comments, notify_all]
        roles: [AOR_LEAD]
      - id: S6-T08
        from: UNDER_REVIEW
        event: RECEIVE_COMMENTS
        to: MODIFICATION_REQUIRED
        guards: [comments_linked]
        effects: [create_comments, notify_owners]
        roles: [AOR_LEAD]
      - id: S6-T09
        from: UNDER_REVIEW
        event: REJECT
        to: REJECTED
        guards: [rejection_reason_recorded]
        effects: [create_high_risk, notify_executive]
        roles: [AOR_LEAD, STAKEHOLDER_MANAGER]
      - id: S6-T10
        from: MODIFICATION_REQUIRED
        event: REVISE
        to: DRAFT
        guards: [new_revision_created]
        effects: [notify_owner]
        roles: [AOR_LEAD]
      - id: S6-T11
        from: [DRAFT, IN_REVIEW, READY, SUBMITTED, ACKNOWLEDGED, UNDER_REVIEW, MODIFICATION_REQUIRED]
        event: WITHDRAW
        to: WITHDRAWN
        guards: [reason_recorded]
        effects: [audit_event]
        roles: [STAKEHOLDER_MANAGER]
      - id: S6-T12
        from: [DRAFT, IN_REVIEW, READY, SUBMITTED, ACKNOWLEDGED, UNDER_REVIEW, MODIFICATION_REQUIRED]
