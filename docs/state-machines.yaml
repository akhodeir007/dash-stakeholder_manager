source_conflicts:
  - id: SC-01
    topic: AOR legal entity
    sources: [SRC-PRD, SRC-TRACKER]
    conflict: "PRD names Dorsch Gruppe; tracker header names Engineering Consultants Group (ECG)."
    resolution: "Keep AOR role abstract; confirm legal entity and MEPS account owner in S0. Do not hard-code either name."
  - id: SC-02
    topic: Site clearance reference
    sources: [SRC-PRD, SRC-TRACKER, SRC-STRATEGY]
    conflict: "PRD/strategy use B2-SC-A-2026-001625; tracker uses B2-SC-A-2026-001525 for most entities and 001625 for five."
    resolution: "Model an application family with active and legacy refs; never merge refs silently."
  - id: SC-03
    topic: Site clearance entity set
    sources: [SRC-PRD, SRC-TRACKER]
    conflict: "PRD names five entities; tracker lists sixteen."
    resolution: "Import all sixteen; mark thirteen required and three not-required seeds; the five PRD entities are the current critical subset."
  - id: SC-04
    topic: TAQA Water status
    sources: [SRC-STRATEGY, SRC-TRACKER]
    conflict: "Strategy says APPROVED; tracker says comments/resubmission required for ENOC design, site plan and undertaking."
    resolution: "Preserve strategy and tracker assertions; quarantine reliance until current authority evidence resolves the conflict. Neither source automatically wins."
  - id: SC-05
    topic: ADSSC status and acronym
    sources: [SRC-PRD, SRC-TRACKER, SRC-STRATEGY]
    conflict: "PRD/strategy spell ADSCC and say rejected/unavailable; tracker spells ADSSC and says comments/resubmission required with an undertaking letter."
    resolution: "Use ADSSC as canonical; model unavailable-service comment as the blocking condition; do not assume a formal rejection letter exists."
  - id: SC-06
    topic: Permit scope and packages
    sources: [SRC-TRACKER, SRC-PRD]
    conflict: "Tracker has Preliminary Approvals and Package I; PRD describes one project-level Step 04."
    resolution: "Make Step 04 package-scoped; Package I is the first package; building list and package scope must be confirmed."
  - id: SC-07
    topic: Contractor role
    sources: [SRC-PPTX, SRC-PRD]
    conflict: "PPTX says contractor issues the building permit after consultant appointments; PRD plan assigns issuance to AOR."
    resolution: "Add CONTRACTOR role; contractor is the issuing party; AOR records and verifies."
  - id: SC-08
    topic: Step 03A/03B current requirement
    sources: [SRC-STRATEGY, SRC-PRD]
    conflict: "PRD describes a broad Step 03A/03B workstream list; strategy says only EAD is currently required and no separate 03B submission is planned."
    resolution: "Keep the workstream family but add current-state mode; only EAD is active now; all others are monitor/conditional until MEPS activates them."
  - id: SC-09
    topic: ENOC dependency
    sources: [SRC-TRACKER, SRC-PPTX]
    conflict: "Tracker remarks require ENOC design/construction stage approval for TAQA super-plot; PRD does not mention ENOC."
    resolution: "Add ENOC_INFRASTRUCTURE workstream with cross-links to TAQA Water and TAQA Electricity."
  - id: SC-10
    topic: LDN expansion
    sources: [SRC-STRATEGY]
    conflict: "Strategy says the precise expansion of LDN is to be confirmed; PRD uses Load Demand Notification."
    resolution: "Use 'LDN electrical-distribution package' as working term; confirm expansion before external technical submission."

