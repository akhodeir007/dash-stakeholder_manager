# Al-Amerah Governance Dashboard — State Machine Contract
# Version 1.2 — 2 November 2026 — W1 software-contract reconciliation
# This file is the implementation contract. Code, tests and diagrams are generated from it.
# Changing a state or transition requires a review and a new machine_version.

version: "1.2"
project: al-amerah-governance
timezone: Asia/Dubai
business_week: [Mon, Tue, Wed, Thu, Fri]
clock_source: injected
idempotency: required
ledger: append_only
machine_versioning: required

# Global requirements apply in addition to every machine's local guards.
# These are software safety semantics, not new regulatory approvals or conditions.
behavioral_contract:
  decision_record: docs/execution/SPEC_DECISIONS.md
  enforcement: server_side_within_command_transaction
  unknown_guard_result: deny
  terminal_semantics: declared_success_or_stop_milestone_not_an_implicit_transition_ban
  revalidation:
    statuses: [CLEAR, REQUIRED]
    default_on_dependency_change: REQUIRED
    rewrite_authority_state: false
    automatic_legal_revocation: false
    guarded_actions: [release, submit, resubmit, record_stamp, record_issuance, activate_inspection, signoff, construction_start]
    recording_historical_authority_fact: allowed_with_quarantined_reliance
    dependency_changes: [expiry, revocation, suspension, scope_change, design_revision_change, requirement_change, evidence_supersession, exemption_revocation]
    recovery: fresh_independent_verification_and_current_gate_evaluation
    propagation: transactional_dependency_epoch_invalidation_then_idempotent_async_recompute
    stale_snapshot: deny_even_if_machine_state_says_ready_or_approved
  scope_binding:
    applies_to: package_permit_gate_and_reliance_snapshots
    required_fields: [project_id, package_id, plot_ids, scope_version, design_revision, requirement_snapshot_id, evidence_version_ids]
    non_gate_intake_variants: [PROJECT_SCOPE, PROVISIONAL_PLOT_SCOPE]
    provisional_scope_can_satisfy_package_gate: false
    immutable_gate_snapshot: true
    unknown_applicability_blocks: true
    catalogue_track_activates_requirement: false
    seed_status_is_executable_state: false
    applicability_values: [REQUIRED, NOT_REQUIRED, UNKNOWN]
    applicability_source: verified_versioned_per_package_requirement_snapshot
    shared_evidence: explicit_verified_coverage_for_each_binding
    step03_activation_does_not_waive_full_permit_prerequisites: true
  evidence_validation:
    regulated_uploader_must_differ_from_validator: true
    recording_equals_validation: false
    regulated_classes: [AUTHORITY_APPROVAL, NOC, STAMPED_TECHNICAL_DOCUMENT, LEGAL_AUTHORIZATION, EXEMPTION, WAIVER]
    authority_validator_roles: [STAKEHOLDER_MANAGER]
    structural_validator_roles: [THIRD_PARTY_INSPECTOR]
    named_validator_assignment_and_scope_must_be_verified: true
    technical_signer_may_be_uploader: true
    structural_uploader_validator_overlap: requires_different_credentialed_assigned_inspector
    stamp_requires_assigned_credentialed_signer: true
    authorization_rechecked_at_commit: true
    signer_is_distinct_from_recording_actor: true  # identities stored separately; not necessarily different people
    dual_control: two_distinct_eligible_humans_bound_to_same_command_hash_and_versions
    dual_control_role_pairs:
      SM1-T04: [[STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]]
      SM1-T07: [[CLIENT_EXECUTIVE, SYSTEM_ADMIN]]
      SMC-T06: [[CLIENT_EXECUTIVE, SYSTEM_ADMIN]]
      S2B-T10: [[CLIENT_EXECUTIVE, SYSTEM_ADMIN]]
      S2B-T14: [[STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]]
      S2BC-T14: [[STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE], [SYSTEM_ADMIN, CLIENT_EXECUTIVE]]
      S2D-T09: [[STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]]
      S3-T08: [[CLIENT_EXECUTIVE, SYSTEM_ADMIN]]
      S7-T07: [[CLIENT_EXECUTIVE, CLIENT_EXECUTIVE]]  # distinct people; one role twice never means one person twice
      S11-T06: [[SYSTEM_ADMIN, CLIENT_EXECUTIVE]]
  third_party:
    plan_review_required_state: INSPECTION_ACTIVE
    inspection_required_state: INSPECTION_ACTIVE
    licensing_approval_allows_technical_work: false
    scope_and_assignment_required_for_each_technical_act: true
    policy_status: conservative_software_lock_pending_any_evidenced_aor_amendment
  correction:
    storage: append_only_superseding_fact
    direct_state_write: false
    regulatory_gate_clearing: ordinary_independent_evidence_and_guard_rules_only
    permitted_role: SYSTEM_ADMIN
    requires: [reason, source_assertion_id, replacement_assertion, actor, timestamp, evidence_links]
    regulated_correction_independent_approval: true
  fallback:
    execution_status: DISABLED_PENDING_SEPARATE_CONTRACT
    counts_as_full_permit: false
    adm_direction_required: true
    full_permit_route: COORDINATED_ONLY
    placeholder_guard_semantics: false_for_any_standalone_full_permit_command
  events:
    registry_reference: docs/execution/COMMAND_SCHEMA_SPEC.md
    reviewed_registry_may_declare_conditional_emissions: true
    required_fields: [event_id, event_type, schema_version, producer_type, producer_id, aggregate_id, aggregate_version, project_id, scope_binding, dependency_epoch, occurred_at, correlation_id, causation_id]
    unlock_handler: recompute_from_current_committed_facts
    dedupe_required: true
    dedupe_key: handler_name_and_event_id
    stale_event_cannot_unlock: true
    external_authority_writeback: false
    side_effect_aliases_are_recording_only: [submit_coordinated_transaction, notify_authorities, notify_authority, notify_authority_owner]
    unspecified_producer: disabled_until_registered_with_schema_and_tests
    drex_extraction_default: disabled_until_hosting_policy_approved

