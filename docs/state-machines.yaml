        effects: [notify_owner, create_renewal_action]
        roles: [SYSTEM]
      - id: S10-T07
        from: EXPIRING
        event: EXPIRE
        to: EXPIRED
        guards: [expiry_date_passed]
        effects: [recompute_dependent_gates, notify_all]
        roles: [SYSTEM]
      - id: S10-T08
        from: EXPIRING
        event: RENEW
        to: ACTIVE
        guards: [renewed_document_validated]
        effects: [update_expiry, schedule_alerts]
        roles: [AOR_LEAD]
      - id: S10-T09
        from: [EXTRACTED, VALIDATED, QUARANTINED]
        event: REJECT
        to: REJECTED
        guards: [rejection_reason_recorded]
        effects: [notify_owner]
        roles: [AOR_LEAD, STAKEHOLDER_MANAGER]
      - id: S10-T10
        from: [ACTIVE, EXPIRING, EXPIRED]
        event: SUPERSEDE
