# ---------------------------------------------------------------------------
# SM-7 — Risk and blocker
# ---------------------------------------------------------------------------

  SM_7_risk:
    title: Risk and blocker
    aggregate: Risk
    initial: OPEN
    terminal: [CLOSED]
    states:
      OPEN: {kind: initial}
      ASSESSED: {kind: active}
      MITIGATING: {kind: active}
      ESCALATED: {kind: active}
      RESOLVED: {kind: success}
      CLOSED: {kind: success}
      ACCEPTED: {kind: active, requires_review_date: true}
    transitions:
      - id: S7-T01
        from: OPEN
        event: ASSESS
        to: ASSESSED
        guards: [severity_assigned, owner_assigned, decision_due_date_set]
        effects: [update_executive_view]
        roles: [STAKEHOLDER_MANAGER]
      - id: S7-T02
        from: ASSESSED
        event: START_MITIGATION
        to: MITIGATING
        guards: [mitigation_plan_recorded]
        effects: [notify_owner]
        roles: [STAKEHOLDER_MANAGER]
      - id: S7-T03
        from: [ASSESSED, MITIGATING]
        event: ESCALATE
        to: ESCALATED
        guards: [escalation_level_assigned, escalation_reason_recorded]
        effects: [notify_executive, create_escalation_record]
        roles: [STAKEHOLDER_MANAGER, CLIENT_EXECUTIVE]
      - id: S7-T04
        from: ESCALATED
        event: DEESCALATE
        to: MITIGATING
        guards: [escalation_resolved, reason_recorded]
        effects: [notify_owner]
        roles: [CLIENT_EXECUTIVE]
      - id: S7-T05
        from: MITIGATING
        event: RESOLVE
        to: RESOLVED
        guards: [resolution_evidence_captured]
        effects: [notify_all, update_executive_view]
        roles: [STAKEHOLDER_MANAGER]
      - id: S7-T06
        from: RESOLVED
        event: CLOSE
        to: CLOSED
        guards: [closure_approved]
