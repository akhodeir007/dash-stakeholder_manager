global_cases:
  - {id: I1, requirement: "I1 — No APPROVED/ACTIVE state without valid evidence and authority reference where the rule requires it", given: "synthetic transition targeting APPROVED or ACTIVE with evidence and authority-reference requirements", when: "evaluate transition once with valid records and once with missing/invalid/unknown required evidence or reference", then: "allow only valid fully supported assertion; otherwise deny atomically", owner_task: BUILD-004}
  - {id: I2, requirement: "I2 — No downstream submission while an upstream hard gate is open", given: "downstream submission and an upstream hard gate open, unknown, stale, or unverified", when: "submit downstream command", then: "deny without transition, ledger, or outbox partial write", owner_task: BUILD-002}
  - {id: I3, requirement: "I3 — No transition without a ledger row, actor and timestamp", given: "valid transition command with authenticated actor and injected timestamp", when: "commit transition and inject ledger/actor/time persistence failure", then: "successful transition always has ledger row, actor, timestamp; any failure rolls back", owner_task: BUILD-002}
  - {id: I4, requirement: "I4 — No DREX output can directly cause a state transition", given: "DREX recommendation presented as command/event payload", when: "process recommendation", then: "persist advisory decision only; no machine transition or decision-text mutation", owner_task: INTEGRATE-003}
  - {id: I5, requirement: "I5 — One active baseline per project; frozen versions are immutable", given: "project with active frozen baseline", when: "attempt second active baseline or edit frozen version", then: "reject direct mutation; baseline change proceeds only through declared approved versioned workflow", owner_task: DOMAIN-001}
  - {id: I6, requirement: "I6 — The validity clock starts once and never resets except a documented renewal", given: "masterplan clock started and recorded validity window", when: "repeat start or change dates without documented renewal", then: "preserve original clock; reject reset and allow only renewal path", owner_task: DOMAIN-001}
