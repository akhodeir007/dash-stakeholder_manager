source: docs/state-machines.yaml
runtime_coverage: not_implemented
status: PLANNED_NOT_EXECUTED
templates:
  positive: "<transition-id>:positive:<from-state>:<allowed-role>; one case for each legal from x allowed-role fixture, subject to global policy; role-ineligible actions are explicit denials, not positive cases; distinct eligible identities for dual control"
  illegal_from: "<transition-id>:illegal_from:<state>; one case per machine state not in that transition's declared from_states, plus invalid-enum sentinel; all local guards true, otherwise authorized actor"
  illegal_role: "<transition-id>:illegal_role:<from-state>:<role>; each legal from x each project role absent from allowed_roles, all guards true"
  guard_false: "<transition-id>:guard_false:<guard>:<from-state>:<allowed-role>; each named local guard independently false while every other applicable guard true"
  guard_unknown: "<transition-id>:guard_unknown:<guard>:<from-state>:<allowed-role>; each named local guard unknown while every other applicable guard true; assert fail-closed"
  rollback: "<transition-id>:rollback:<failure-point>; inject failure after each transactional write/effect and assert state, ledger, outbox and epoch atomicity"
  dual_control: "<transition-id>:dual_control:<from-state>; two distinct eligible human identities, required role combination, same canonical command hash/scope/evidence/dependency versions; reject same identity or changed version"
  expansion: "Deterministic cartesian products in listed order; global case IDs are literal; generated cases are PLANNED, never counted as executed"
